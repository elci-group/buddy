[package]
name = "buddy"
version = "0.3.4"
edition = "2021"
description = "A local system-context assistant with Groq intelligence and Voxd speech"
license = "MIT"
repository = "https://github.com/elci-group/buddy"

[dependencies]
sysinfo = "0.28"
rusqlite = { version = "0.29", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
obws = { version = "0.15", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
