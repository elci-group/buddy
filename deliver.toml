[[file]]
path = "Cargo.toml"
required = true
forbid_regex = ["TODO", "FIXME"]

[[file]]
path = "src/main.rs"
required = true
min_size_bytes = 1000
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "src/obs.rs"
required = true
min_size_bytes = 1000
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "src/skillastic.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "examples/obs-scene.json"
required = true

[[file]]
path = ".skillastic/config.json"
required = true

[[file]]
path = ".skillastic/skills/obs-scene-management.json"
required = true

[[file]]
path = ".skillastic/skills/obs-scene-management.md"
required = true

[[file]]
path = "README.md"
required = true
require_regex = ["cargo install", "GROQ_API_KEY", "buddy scan", "buddy ask", "buddy update", "buddy ask --screen", "buddy avatar", "buddy skillastic", "buddy obs compose"]

[[command]]
name = "format check"
cmd = ["cargo", "fmt", "--check"]
expect_exit = 0
timeout_secs = 60

[[command]]
name = "clippy"
cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "penguin sprite"
cmd = ["identify", "assets/buddy-penguin-sprite.png"]
expect_exit = 0
timeout_secs = 30
stdout_contains = ["PNG 2149x732"]

[[command]]
name = "four-frame penguin animation"
cmd = ["identify", "assets/buddy-penguin.gif"]
expect_exit = 0
timeout_secs = 30
stdout_contains = ["buddy-penguin.gif[3]"]

[[command]]
name = "tests"
cmd = ["cargo", "test"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "release build"
cmd = ["cargo", "build", "--release"]
expect_exit = 0
timeout_secs = 300

[git]
no_uncommitted_changes = false
no_untracked_files = false
